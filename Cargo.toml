[package]
name = "FileFly"
version = "2026.11.3"
edition = "2024"
license="AGPL-3.0-or-later"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
window-vibrancy = "0"
file_icon_provider = "1"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"
mime_guess = "2"
resvg = "0"

[dependencies]
device_query = "4"
clipboard-rs = "0"
url = "2"
eframe = { version = "0.37", features = ["glow"] }
egui_extras = { version = "0.37", features = ["svg"] }
dirs = "7"
drag = "2"
dunce = "1"
open = "5"
rfd = "0.17"
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0", features = ["ico"] }
trash = "5.2"
chrono = "0.4"
notify = "8.2"
raw-window-handle = "0.6"
jwalk = "0.9"
num-format = "0.4"
libc = "0.2"
semver = "1"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
winres = "0"

[package.metadata.appimage]
icon = "assets/logo.png"
desktop_entry = "other/FileFly.desktop"
