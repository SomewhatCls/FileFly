[package]
name = "FileFly"
version = "0.2.9"
edition = "2024"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
winreg = "0.56"

[dependencies]
file_icon_provider = "1"
device_query = "4"
clipboard-rs = "0.3"
url = "2"
eframe = { version = "0.36", features = ["glow"] }
egui_extras = { version = "0.36", features = ["svg"] }
dirs = "7"
drag = "2"
dunce = "1"
open = "5"
rfd = "0.17"
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["ico"] }
trash = "5.2"
chrono = "0.4"
notify = "8.2"
raw-window-handle = "0.6"
jwalk = "0.9"

[build-dependencies]
winres = "0.1"

[package.metadata.appimage]
icon = "assets/logo.png"
desktop_entry = "other/FileFly.desktop"
